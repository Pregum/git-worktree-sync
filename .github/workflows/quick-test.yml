name: Quick Test

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Git
      run: |
        git config --global user.name "CI Test"
        git config --global user.email "ci@example.com"
        
    - name: Verify dependencies
      run: |
        which rsync
        rsync --version | head -1
        
    - name: Make scripts executable
      run: |
        chmod +x git-worktree-sync
        chmod +x test/*.sh
        
    - name: Run quick tests
      run: |
        cd test
        ./quick-test.sh
        
    - name: Basic functionality check
      run: |
        cd test
        ./setup.sh >/dev/null 2>&1
        cd test-repo
        
        # Test basic worktree creation
        ../../git-worktree-sync add quick/ci-test -b ../test-worktrees >/dev/null 2>&1
        
        # Verify it worked
        if [[ -d "../test-worktrees/quick-ci-test" ]]; then
          echo "✓ Basic functionality works"
        else
          echo "✗ Basic functionality failed"
          exit 1
        fi
        
        # Cleanup
        cd ..
        ./setup.sh --clean >/dev/null 2>&1