name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Git
      run: |
        git config --global user.name "CI Test"
        git config --global user.email "ci@example.com"
        
    - name: Install dependencies
      run: |
        # Ensure rsync is available (should be pre-installed on both OS)
        if command -v rsync >/dev/null 2>&1; then
          echo "✓ rsync is available"
          rsync --version | head -1
        else
          echo "⚠ rsync not found, installing..."
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y rsync
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install rsync
          fi
        fi
        
    - name: Verify script permissions
      run: |
        chmod +x git-worktree-sync
        chmod +x test/setup.sh
        chmod +x test/run-tests.sh
        chmod +x test/quick-test.sh
        
    - name: Run quick tests
      run: |
        cd test
        ./quick-test.sh
        
    - name: Run full test suite
      run: |
        cd test
        timeout 300 ./run-tests.sh || {
          echo "Tests timed out after 5 minutes"
          exit 1
        }
        
    - name: Verify installation script
      run: |
        # Test install script in temporary directory
        TEMP_DIR=$(mktemp -d)
        cp install.sh git-worktree-sync "$TEMP_DIR/"
        cd "$TEMP_DIR"
        
        # Test with custom install directory
        INSTALL_DIR="$TEMP_DIR/bin" ./install.sh
        
        # Verify installation
        if [[ -x "$TEMP_DIR/bin/git-worktree-sync" ]]; then
          echo "✓ Installation script works"
          "$TEMP_DIR/bin/git-worktree-sync" version
        else
          echo "✗ Installation script failed"
          exit 1
        fi
        
        # Cleanup
        rm -rf "$TEMP_DIR"
        
    - name: Test performance with large directories
      run: |
        cd test
        
        # Set up test environment
        ./setup.sh
        
        cd test-repo
        
        # Create larger test environment
        mkdir -p large_test/{node_modules,venv,dist,build}
        for i in {1..100}; do
          echo "file $i" > "large_test/node_modules/file$i.js"
          echo "file $i" > "large_test/venv/file$i.py"
          echo "file $i" > "large_test/dist/file$i.min.js"
          echo "file $i" > "large_test/build/file$i.o"
        done
        
        # Test that large directories are excluded (should be fast)
        time_start=$(date +%s)
        ../../git-worktree-sync add perf/test -b ../test-worktrees >/dev/null 2>&1
        time_end=$(date +%s)
        duration=$((time_end - time_start))
        
        echo "Performance test completed in ${duration}s"
        
        # Verify large directories were excluded
        if [[ ! -d "../test-worktrees/perf-test/large_test/node_modules" ]]; then
          echo "✓ Large directories properly excluded"
        else
          echo "⚠ Large directories were copied (performance issue)"
        fi
        
        # Cleanup
        git worktree remove ../test-worktrees/perf-test 2>/dev/null || true
        rm -rf large_test
        cd ..
        ./setup.sh --clean
        
    - name: Test edge cases
      run: |
        cd test
        ./setup.sh
        cd test-repo
        
        echo "Testing edge cases..."
        
        # Test branch with special characters
        if ../../git-worktree-sync add "feature/test-chars_123" -b ../test-worktrees >/dev/null 2>&1; then
          echo "✓ Special characters in branch names handled"
          git worktree remove ../test-worktrees/feature-test-chars_123 2>/dev/null || true
        else
          echo "⚠ Special characters test failed"
        fi
        
        # Test missing configuration gracefully
        mv .git-worktree-sync-copy.conf .git-worktree-sync-copy.conf.bak
        if ../../git-worktree-sync add "test/no-config" -b ../test-worktrees >/dev/null 2>&1; then
          echo "✓ Missing configuration handled gracefully"
          git worktree remove ../test-worktrees/test-no-config 2>/dev/null || true
        else
          echo "⚠ Missing configuration test failed"
        fi
        mv .git-worktree-sync-copy.conf.bak .git-worktree-sync-copy.conf
        
        # Test empty worktree directory
        if ../../git-worktree-sync add "test/empty" -b ../test-worktrees --no-copy-ignored >/dev/null 2>&1; then
          echo "✓ Empty worktree creation works"
          git worktree remove ../test-worktrees/test-empty 2>/dev/null || true
        else
          echo "⚠ Empty worktree test failed"
        fi
        
        cd ..
        ./setup.sh --clean
        
    - name: Archive test results
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-logs-${{ matrix.os }}
        path: |
          test/test-repo/.git/logs/
          test/test-worktrees/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Run ShellCheck on main script
      run: |
        echo "Checking main script..."
        shellcheck git-worktree-sync
        
    - name: Run ShellCheck on test scripts  
      run: |
        echo "Checking test scripts..."
        shellcheck test/setup.sh
        shellcheck test/run-tests.sh  
        shellcheck test/quick-test.sh
        
    - name: Run ShellCheck on install script
      run: |
        echo "Checking install script..."
        shellcheck install.sh

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for secrets in code
      run: |
        echo "Checking for potential secrets..."
        
        # Check for common secret patterns
        if grep -r -i "password\|secret\|key\|token" --include="*.sh" . | grep -v "# "; then
          echo "⚠ Potential secrets found in code"
          exit 1
        else
          echo "✓ No secrets detected"
        fi
        
    - name: Verify script security
      run: |
        echo "Checking script security..."
        
        # Check for dangerous commands
        dangerous_commands="rm -rf /|sudo rm|chmod 777|> /dev/"
        if grep -r "$dangerous_commands" --include="*.sh" .; then
          echo "⚠ Potentially dangerous commands found"
          exit 1
        else
          echo "✓ No dangerous commands detected"
        fi
        
    - name: Check file permissions
      run: |
        echo "Checking file permissions..."
        
        # Ensure scripts are executable but not overly permissive
        find . -name "*.sh" -type f | while read -r script; do
          perms=$(stat -c "%a" "$script")
          if [[ "$perms" != "755" && "$perms" != "644" ]]; then
            echo "⚠ Unusual permissions on $script: $perms"
            # Don't fail on this, just warn
          fi
        done
        
        echo "✓ File permissions check completed"