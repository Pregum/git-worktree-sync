# Git worktree sync copy configuration
# This file defines which files/directories should be copied to new worktrees
# Format: one pattern per line, supports glob patterns

# Environment files
.env
.env.local
.env.*.local

# IDE settings
.vscode/

# Private keys (be careful with these)
# *.key
# *.pem

# Specific files
.npmrc
.yarnrc

# Exclude large directories by commenting them out
# node_modules/
# .venv/
# vendor/