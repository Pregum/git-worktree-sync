# Git worktree sync copy configuration
# Format:
#   pattern      - Include pattern (default)
#   +pattern     - Explicit include pattern
#   -pattern     - Exclude pattern (in addition to defaults)
#   !pattern     - Force include pattern (overrides exclude)

# Environment files
.env
.env.local
.env.*.local

# IDE settings
.vscode/

# Configuration files
.npmrc
.yarnrc
tsconfig.json

# Large directories are excluded by default for performance
# Use ! prefix to force include if needed:
# !node_modules/package.json
# !vendor/autoload.php